      security:
      - OAuth2:
        - custom_code:read
      operationId: get-page-custom-code
      summary: Webflow Get Custom Code
      description: 'Get all scripts applied to a page.


        Required scope | `custom_code:read`

        '
      tags:
      - Custom Code - Pages
      parameters:
      - name: page_id
        in: path
        description: Unique identifier for a Page
        example: 63c720f9347c2139b248e552
        required: true
        schema:
          type: string
          format: objectid
          default: null
      responses:
        '200':
          description: Request was successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  scripts:
                    type: array
                    description: A list of scripts applied to a Site or a Page
                    items:
                      type: object
                      required:
                      - id
                      - version
                      - location
                      properties:
                        id:
                          description: ID of the registered custom code script
                          type: string
                          format: objectId
                        location:
                          description: Location of the script, either in the header or footer of the published site
                          type: string
                          default: header
                          enum:
                          - header
                          - footer
                        version:
                          type: string
                          description: Semantic Version String for the registered script *e.g. 0.0.1*
                        attributes:
                          type: object
                          description: Developer-specified key/value pairs to be applied as attributes to the script
                      example:
                      - id: cms_slider
                      - location: header
                      - version: 1.0.0
                  lastUpdated:
                    type: string
                    format: date-string
                    readOnly: true
                    description: Date when the Site's scripts were last updated
                  createdOn:
                    type: string
                    format: date-string
                    readOnly: true
                    description: Date when the Site's scripts were created
                example:
                  scripts:
                  - id: cms_slider
                    location: header
                    version: 1.0.0
                    attributes:
                      my-attribute: some-value
                  - id: alert
                    location: header
                    version: 0.0.1
              example:
                value:
                  scripts:
                  - id: cms_slider
                    location: header
                    version: 1.0.0
                    attributes:
                      my-attribute: some-value
                  - id: alert
                    location: header
                    version: 0.0.1
                    attributes: {}
