  /sites:
    get:
      x-fern-sdk-group-name: sites
      x-fern-sdk-method-name: list
      security:
      - OAuth2:
        - sites:read
      operationId: list-sites
      summary: Webflow List Sites
      description: 'List of all sites the provided access token is able to access.


        Required scope | `sites:read`

        '
      tags:
      - Sites
      responses:
        '200':
          description: Request was successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  sites:
                    type: array
                    items:
                      example:
                        id: 42e98c9a982ac9b8b742
                        workspaceId: 42e63e98c9a982ac9b8b742
                        displayName: The Hitchhiker's Guide to the Galaxy
