                          - id: 654112a3a525b2739d97664c
                            cmsLocaleId: 654112a3a525b2739d97664f
                            enabled: true
                            displayName: Spanish (Mexico)
                            displayImageId: null
                            subdirectory: es-mx
                            tag: es-MX
                        dataCollectionEnabled: true
                        dataCollectionType: always
